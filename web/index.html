<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TamaClaudchi</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">
    <span class="brand-mark">◓</span>
    <h1>TamaClaudchi</h1>
  </div>
  <div id="counts" class="stat-row"></div>
  <div id="legend" class="legend-wrap"></div>
  <button id="new-agent" class="new-agent-btn">+ hatch agent</button>
  <button id="theme-toggle" class="theme-btn" title="Switch light / dark">☀</button>
  <div id="conn" class="conn">connecting…</div>
</header>
<main id="grid"></main>
<div id="modal-overlay" class="modal-overlay hidden">
  <div id="modal" class="modal" role="dialog" aria-modal="true"></div>
</div>
<div id="spawn-overlay" class="modal-overlay hidden">
  <div class="spawn-dialog" role="dialog" aria-modal="true">
    <div class="spawn-title">New agent</div>
    <label class="spawn-label">Working directory</label>
    <input id="spawn-cwd" class="spawn-input" type="text" placeholder="~/projects/…">
    <label class="spawn-label">Session <span class="dim">(fresh, or resume a past conversation from this folder)</span></label>
    <select id="spawn-resume" class="spawn-input"><option value="">start a fresh session</option></select>
    <label class="spawn-label">tmux session name <span class="dim">(optional — defaults to the folder name)</span></label>
    <input id="spawn-name" class="spawn-input" type="text" placeholder="e.g. klimt-eval">
    <label class="spawn-label">First message <span class="dim">(optional)</span></label>
    <textarea id="spawn-prompt" class="spawn-input" rows="3" placeholder="What should this agent work on?"></textarea>
    <div class="spawn-actions">
      <button id="spawn-cancel" class="btn-ghost">Cancel</button>
      <button id="spawn-go" class="send-btn">Launch agent</button>
      <span id="spawn-status" class="composer-status"></span>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
